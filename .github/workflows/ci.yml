name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev --extra api --extra viz
      - name: Ruff check
        run: uv run ruff check src/ tests/ examples/ benchmarks/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ examples/ benchmarks/
      - name: Mypy
        run: uv run mypy src/alphasig/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --extra dev --extra api --extra viz
      - name: Run tests
        run: uv run pytest --cov=alphasig --cov-report=xml
      - name: Run offline demo
        run: uv run python examples/demo.py
      - name: Benchmark smoke run
        if: matrix.python-version == '3.12'
        run: uv run python -m benchmarks.run --quick --out "$RUNNER_TEMP/bench" --label quick
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  package:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: List wheel contents
        run: python -m zipfile -l dist/*.whl
      - name: Install wheel into a fresh venv
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
      - name: Smoke test
        run: |
          /tmp/smoke/bin/python -c "import alphasig; print(alphasig.__version__)"
          /tmp/smoke/bin/python -c "import importlib.resources as r; assert r.files('alphasig').joinpath('py.typed').is_file()"
          /tmp/smoke/bin/alphasig --help
          /tmp/smoke/bin/sigint --help
